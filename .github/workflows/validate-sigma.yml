name: Validate Sigma Rules

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pySigma pysigma-plugin-splunk pyyaml

      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          errors = 0
          files = [p for p in pathlib.Path(".").rglob("*.yml") if ".git" not in p.parts]
          for path in files:
              try:
                  with open(path, encoding="utf-8") as f:
                      list(yaml.safe_load_all(f))
                  print(f"OK    {path}")
              except yaml.YAMLError as e:
                  print(f"ERROR {path}: {e}")
                  errors += 1
          print(f"\nChecked {len(files)} file(s), {errors} error(s).")
          sys.exit(1 if errors else 0)
          PY

      - name: Convert Sigma rules to Splunk SPL
        run: |
          echo "TODO: convert Sigma rules to Splunk SPL"
          # Example:
          # sigma convert -t splunk -p splunk_windows --skip-unsupported \
          #   persistence lateral_movement discovery credential_access execution \
          #   defense_evasion initial_access command_and_control exfiltration impact \
          #   -o output/splunk_searches.spl

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Splunk
        env:
          HEC_URL: ${{ secrets.HEC_URL }}
          HEC_TOKEN: ${{ secrets.HEC_TOKEN }}
        run: |
          echo "TODO: deploy converted searches to Splunk via API"
          # Example:
          # curl -sS -H "Authorization: Splunk ${HEC_TOKEN}" "${HEC_URL}" -d @output/payload.json
