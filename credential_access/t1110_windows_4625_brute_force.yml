title: Brute Force Logon Detection (T1110)
description: Detection rule that detects when an ip address makes more than 5 failed logon attempts in 15 minutes
author: Ron Harper
date: 2026-10-01
tags:
  - attack.t1110
  - detection.threshold_based
logsource:
  product: windows
  service: security
  category: authentication
detection:
  selection:
    EventID: 4625
  filter_local:
    src_ip:
      - '127.0.0.1'
      - '0.0.0.0'
  condition:
    - selection and not filter_local
    group-by:
      - src_ip
      - Account_Name
    timeframe: 15m
    count(selection): '> 5'